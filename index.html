                    { id: "d", text: "d) Hệ điều hành không cần thiết đối với máy tính.", correct: false, explanation: "Sai. Máy tính bắt buộc cần Hệ điều hành." }
                ]
            },
            {
                id: 26,
                type: "tf",
                section: "PHẦN II. CÂU HỎI TRẮC NGHIỆM ĐÚNG/SAI",
                question: "Câu 2. Phần mềm nguồn mở là phần mềm mà mã nguồn được công khai và cho phép người dùng tự do sử dụng, sửa đổi và phân phối lại.",
                statements: [
                    { id: "a", text: "a) Phần mềm nguồn mở là phần mềm miễn phí.", correct: false, explanation: "Sai. Mã nguồn mở chưa chắc đã miễn phí toàn bộ dịch vụ." },
                    { id: "b", text: "b) Phần mềm nguồn mở không được phép sử dụng cho mục đích thương mại.", correct: false, explanation: "Sai. Vẫn được dùng thương mại tùy theo bản quyền." },
                    { id: "c", text: "c) Phần mềm nguồn mở có thể được cộng đồng phát triển và cải tiến.", correct: true, explanation: "Đúng." },
                    { id: "d", text: "d) Phần mềm nguồn mở không an toàn bằng phần mềm thương mại.", correct: false, explanation: "Sai. Nhiều nguồn mở rất an toàn." }
                ]
            },
            {
                id: 27,
                type: "tf",
                section: "PHẦN II. CÂU HỎI TRẮC NGHIỆM ĐÚNG/SAI",
                question: "Câu 3. CPU là bộ não của máy tính, chịu trách nhiệm thực hiện các phép tính số học và logic, đồng thời điều khiển hoạt động của các thành phần khác.",
                statements: [
                    { id: "a", text: "a) CPU không có vai trò gì trong việc xử lý thông tin.", correct: false, explanation: "Sai. CPU đảm nhận toàn bộ xử lý." },
                    { id: "b", text: "b) Tốc độ của CPU được đo bằng đơn vị GHz.", correct: true, explanation: "Đúng." },
                    { id: "c", text: "c) CPU chỉ có thể thực hiện một nhiệm vụ tại một thời điểm.", correct: false, explanation: "Sai. CPU đa nhân xử lý nhiều việc song song." },
                    { id: "d", text: "d) CPU không cần thiết đối với máy tính.", correct: false, explanation: "Sai. Không có CPU máy không chạy được." }
                ]
            },
            {
                id: 28,
                type: "tf",
                section: "PHẦN II. CÂU HỎI TRẮC NGHIỆM ĐÚNG/SAI",
                question: "Câu 4. Mạng xã hội là dịch vụ trực tuyến cho phép người dùng kết nối và chia sẻ thông tin với nhau.",
                statements: [
                    { id: "a", text: "a) Facebook là mạng xã hội phổ biến nhất hiện nay.", correct: true, explanation: "Đúng." },
                    { id: "b", text: "b) Mạng xã hội không có bất kỳ tác động tiêu cực nào.", correct: false, explanation: "Sai. Mạng xã hội có rủi ro nghiện, tin giả..." },
                    { id: "c", text: "c) Mạng xã hội có thể được sử dụng cho mục đích kinh doanh.", correct: true, explanation: "Đúng." },
                    { id: "d", text: "d) Mạng xã hội không yêu cầu người dùng phải đăng ký tài khoản.", correct: false, explanation: "Sai. Cần tài khoản để đăng bài, tương tác." }
                ]
            }
        ];

        function App() {
            const [userAnswers, setUserAnswers] = useState({});
            const [submitted, setSubmitted] = useState(false);

            const handleMC = (qId, optionIdx) => {
                if (submitted) return;
                setUserAnswers(prev => ({ ...prev, [qId]: optionIdx }));
            };

            const handleTF = (qId, stmtId, val) => {
                if (submitted) return;
                setUserAnswers(prev => ({
                    ...prev,
                    [qId]: { ...prev[qId], [stmtId]: val }
                }));
            };

            const calculateResults = () => {
                let correctCount = 0;
                let totalItems = 0;

                de1Data.forEach(q => {
                    if (q.type === 'mc') {
                        totalItems += 1;
                        if (userAnswers[q.id] === q.correctAnswer) correctCount += 1;
                    } else if (q.type === 'tf') {
                        q.statements.forEach(st => {
                            totalItems += 1;
                            if (userAnswers[q.id]?.[st.id] === st.correct) correctCount += 1;
                        });
                    }
                });

                const score = Math.round((correctCount / totalItems) * 10 * 10) / 10;
                return { score, correctCount, totalItems };
            };

            const results = submitted ? calculateResults() : null;

            return (
                <div class="max-w-3xl mx-auto bg-white shadow-xl rounded-2xl p-4 md:p-8 border border-slate-200">
                    <header class="border-b pb-4 mb-6 text-center">
                        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full uppercase">Đề Số 1 - Tin học 11 KNTT</span>
                        <h1 class="text-xl md:text-2xl font-bold text-slate-800 mt-2">Bài Ôn Tập Trắc Nghiệm Trực Tác (Đề 1)</h1>
                        <p class="text-slate-500 text-xs mt-1">Gồm 24 câu hỏi ABCD + 4 câu Đúng/Sai (16 ý)</p>
                    </header>

                    {submitted && (
                        <div class="mb-6 p-5 bg-blue-50 border border-blue-200 rounded-xl text-center">
                            <h2 class="text-lg font-bold text-blue-900 mb-1">Kết Quả Đề 1</h2>
                            <div class="text-3xl font-black text-blue-600 mb-1">{results.score} / 10 Điểm</div>
                            <p class="text-xs text-slate-600 mb-3">
                                Trả lời chính xác <span class="font-bold text-blue-700">{results.correctCount}/{results.totalItems}</span> câu/ý.
                            </p>
                            <button 
                                onClick={() => { setSubmitted(false); setUserAnswers({}); }}
                                class="px-5 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition text-sm"
                            >
                                Làm lại Đề 1
                            </button>
                        </div>
                    )}

                    <div class="space-y-6">
                        {de1Data.map((q, idx) => (
                            <div key={q.id} class="p-4 border border-slate-200 rounded-xl bg-slate-50/50">
                                <div class="text-xs font-semibold text-blue-600 uppercase mb-1">{q.section}</div>
                                <div class="font-semibold text-slate-800 text-sm md:text-base mb-3 whitespace-pre-line">
                                    {q.question}
                                </div>

                                {q.type === 'mc' ? (
                                    <div class="grid grid-cols-1 gap-2">
                                        {q.options.map((opt, optIdx) => {
                                            const isSelected = userAnswers[q.id] === optIdx;
                                            const isCorrect = optIdx === q.correctAnswer;
                                            let btnStyle = "bg-white border-slate-200 text-slate-700 hover:bg-slate-100";

                                            if (submitted) {
                                                if (isCorrect) btnStyle = "bg-green-100 border-green-500 text-green-900 font-semibold";
                                                else if (isSelected) btnStyle = "bg-red-100 border-red-500 text-red-900";
                                            } else if (isSelected) {
                                                btnStyle = "bg-blue-100 border-blue-500 text-blue-900 font-semibold";
                                            }

                                            return (
                                                <button
                                                    key={optIdx}
                                                    onClick={() => handleMC(q.id, optIdx)}
                                                    class={`text-left p-2.5 border rounded-lg transition text-xs md:text-sm ${btnStyle}`}
                                                >
                                                    {opt}
                                                </button>
                                            );
                                        })}
                                        {submitted && (
                                            <div class="mt-2 text-xs p-2 bg-slate-100 rounded text-slate-600">
                                                💡 <strong>Giải thích:</strong> {q.explanation}
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    <div class="space-y-2">
                                        {q.statements.map(st => {
                                            const userVal = userAnswers[q.id]?.[st.id];
                                            return (
                                                <div key={st.id} class="bg-white p-2.5 border border-slate-200 rounded-lg flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                                    <span class="text-xs md:text-sm text-slate-700 flex-1">{st.text}</span>
                                                    <div class="flex items-center space-x-2">
                                                        {[true, false].map(val => {
                                                            const isBtnSelected = userVal === val;
                                                            const isRight = val === st.correct;
                                                            let stStyle = "bg-slate-100 text-slate-600 hover:bg-slate-200";

                                                            if (submitted) {
                                                                if (isRight) stStyle = "bg-green-500 text-white font-bold";
                                                                else if (isBtnSelected) stStyle = "bg-red-500 text-white";
                                                            } else if (isBtnSelected) {
                                                                stStyle = "bg-blue-600 text-white font-bold";
                                                            }

                                                            return (
                                                                <button
                                                                    key={String(val)}
                                                                    onClick={() => handleTF(q.id, st.id, val)}
                                                                    class={`px-3 py-1 text-xs rounded border border-transparent transition ${stStyle}`}
                                                                >
                                                                    {val ? "ĐÚNG" : "SAI"}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>

                    {!submitted && (
                        <div class="mt-8 text-center">
                            <button
                                onClick={() => setSubmitted(true)}
                                class="px-8 py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition shadow-md"
                            >
                                Nộp Bài Đề 1 & Xem Điểm
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
